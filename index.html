<!-- Hero Section (Main Banner) -->
<section class="hero">
  <img src="assets/web-main.jpg" alt="Main Banner">
  <div class="hero-text">
    <h1>Latest Trending Electronics</h1>
    <p>Explore a wide range of electronics with amazing offers!</p>
    <button>Shop Now</button>
  </div>
</section>

<!-- Product Listing Section -->
<section class="products">
  <h2>Recommended Items</h2>
  <div class="product-list">
    <div class="product-item">
      <img src="assets/web-listview.jpg" alt="Product 1">
      <h3>Smartwatch</h3>
      <p>$50.00</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-item">
      <img src="assets/web-gridview.jpg" alt="Product 2">
      <h3>Camera</h3>
      <p>$300.00</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-item">
      <img src="assets/web-detail.jpg" alt="Product 3">
      <h3>Laptop</h3>
      <p>$800.00</p>
      <button>Add to Cart</button>
    </div>
  </div>
</section>

<!-- Cart Icon Display -->
<div class="cart">
  <span class="cart-icon">Cart (0)</span>
</div>
<!-- Product Details Section -->
<section class="product-details">
  <div class="product-image">
    <img src="assets/product1.jpg" alt="Product Name">
  </div>
  <div class="product-info">
    <h1>Product Name</h1>
    <p>Description of the product goes here...</p>
    <p class="price">$100.00</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>
  <div class="related-products">
    <h3>Related Products</h3>
    <div class="related-item">
      <img src="assets/product2.jpg" alt="Related Product">
      <p>Product Name</p>
    </div>
  </div>
</section>
